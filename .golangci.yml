version: "2"
linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
    - gosec
  settings:
    gosec:
      excludes:
        - G115 # protocol code converts uint16 <-> byte / int16 on purpose
        - G402 # TLS InsecureSkipVerify is an explicit, documented opt-in
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
formatters:
  enable:
    - gofmt
