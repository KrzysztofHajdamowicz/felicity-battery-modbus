version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    assignees:
      - KrzysztofHajdamowicz
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "deps"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    assignees:
      - KrzysztofHajdamowicz
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
